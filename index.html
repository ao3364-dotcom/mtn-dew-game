<!DOCTYPE html>
<html>
<head>
  <title>Dew Survivor</title>
  <style>
    body { margin:0; background:#111; overflow:hidden; }
    #gameCanvas { background:#222; display:block; margin:0 auto; }

    #titleScreen {
      position:absolute; inset:0; background:#000c;
      display:flex; flex-direction:column; justify-content:center; align-items:center;
      color:white; font-family:sans-serif; font-size:40px;
    }

    #upgradeBox {
      position:absolute; top:20px; left:50%; transform:translateX(-50%);
      background:#0f0; padding:15px; border-radius:10px; display:none;
      font-family:sans-serif; color:#000; font-size:20px;
    }

    button {
      margin-top:20px; padding:10px 20px; font-size:20px; cursor:pointer;
    }
  </style>
</head>
<body>

  <div id="titleScreen">
    <div>Dew Survivor</div>
    <button onclick="startCampaign()">Campaign</button>
  </div>

  <canvas id="gameCanvas" width="900" height="600"></canvas>
  <div id="upgradeBox"></div>

  <script src="game.js"></script>
</body>
</html>
